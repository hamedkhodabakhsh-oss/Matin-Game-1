<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Car Builder</title>
  <style>
    html, body { margin:0; height:100%; background:#0b1220; color:#fff; font-family:-apple-system, system-ui; }
    header { padding:12px 14px; background:#111827; display:flex; justify-content:space-between; align-items:center; }
    header a { color:#c7d2fe; text-decoration:none; font-weight:900; }
    .wrap { height: calc(100% - 52px); display:grid; grid-template-columns: 360px 1fr; }
    @media (max-width: 900px){ .wrap { grid-template-columns: 1fr; grid-template-rows: 380px 1fr; } }
    .panel { padding:12px; border-right:1px solid rgba(255,255,255,.12); background:#0f172a; overflow:auto; }
    .row { margin-bottom: 12px; }
    label { display:flex; justify-content:space-between; font-size:12px; opacity:.85; margin-bottom:6px; }
    input[type="range"], select, input[type="text"], input[type="color"] {
      width:100%; padding:10px; border-radius:12px; border:1px solid rgba(255,255,255,.12); background:#0b1220; color:#fff;
    }
    input[type="range"] { padding:0; border:0; background:transparent; }
    button { width:100%; padding:12px; border-radius:12px; border:0; background:#2563eb; color:#fff; font-weight:900; cursor:pointer; }
    button.secondary { background: rgba(255,255,255,.10); margin-top:8px; }
    #view { position:relative; }
    canvas { display:block; width:100%; height:100%; }
  </style>
</head>

<body>
  <header>
    <a href="garage.html">← Garage</a>
    <div style="font-weight:900;">Car Builder</div>
    <div style="opacity:.7;font-size:12px;">3D Preview</div>
  </header>

  <div class="wrap">
    <div class="panel">
      <div class="row">
        <label><span>Brand</span></label>
        <input id="brand" type="text" placeholder="BMW" />
      </div>

      <div class="row">
        <label><span>Model</span></label>
        <input id="model" type="text" placeholder="M3" />
      </div>

      <div class="row">
        <label><span>Body Type</span></label>
        <select id="bodyType">
          <option value="coupe">Coupe</option>
          <option value="saloon">Saloon</option>
          <option value="suv">SUV</option>
        </select>
      </div>

      <div class="row">
        <label><span>Paint</span></label>
        <input id="paint" type="color" value="#2563eb" />
      </div>

      <div class="row">
        <label><span>Length (mm)</span><span id="lenV">180</span></label>
        <input id="len" type="range" min="120" max="240" value="180" />
      </div>

      <div class="row">
        <label><span>Width (mm)</span><span id="widV">80</span></label>
        <input id="wid" type="range" min="55" max="100" value="80" />
      </div>

      <div class="row">
        <label><span>Height (mm)</span><span id="heiV">55</span></label>
        <input id="hei" type="range" min="35" max="90" value="55" />
      </div>

      <div class="row">
        <label><span>Wheel Radius (mm)</span><span id="wrV">12</span></label>
        <input id="wr" type="range" min="8" max="18" value="12" />
      </div>

      <div class="row">
        <label><span>Wheel Width (mm)</span><span id="wwV">8</span></label>
        <input id="ww" type="range" min="5" max="14" value="8" />
      </div>

      <div class="row">
        <label><span>Ride Height (mm)</span><span id="rhV">6</span></label>
        <input id="rh" type="range" min="2" max="16" value="6" />
      </div>

      <button id="exportBody">Export Body STL</button>
      <button class="secondary" id="exportWheels">Export Wheels STL (4 files)</button>
    </div>

    <div id="view"></div>
  </div>

  <script type="module" src="builder.js"></script>
</body>
</html>
